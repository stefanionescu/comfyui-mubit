[project]
name = "mubit"
version = "0.1.0"
description = "Ask models through Mubit and verify claims with Banyan Sapling in ComfyUI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Ionescu" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4"]

[tool.comfy]
DisplayName = "mubit"
requires-comfyui = ">=0.37.2"

[tool.deptry]
known_first_party = ["src"]
# ComfyUI supplies these modules in its application environment.
per_rule_ignores.DEP001 = ["comfy", "comfy_api", "comfy_api_nodes", "server"]
per_rule_ignores.DEP003 = ["comfy", "comfy_api", "comfy_api_nodes", "server"]
