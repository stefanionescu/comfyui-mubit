#:schema ./.gspot/gspot.schema.json
# gspot settings for this repository. Change them with gspot set, unset, add, remove, ignore, and unignore.

level = "all"
configurations = ["python", "markdown", "licenses"]

[hooks]
enabled = true

[format]
quotes = "single"

[[ignore]]
check = "naming/paths"
paths = ["web/docs/MubitAsk.md", "web/docs/MubitVerify.md", "web/docs/MubitModel.md"]
reason = "ComfyUI locates each native help page using its exact registered node ID."

[[ignore]]
check = "prose/vale"
rule = "gspot.title-case"
paths = ["README.md"]
reason = "The extension name is mubit, including its lowercase README title."

[[ignore]]
check = "python/vulture"
names = ["get_node_list", "comfy_entrypoint", "define_schema", "execute"]
paths = ["__init__.py", "src/nodes/**"]
reason = "ComfyUI calls these registered entry points and node methods by name."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["example_workflows/*"]
reason = "ComfyUI reads the flat example_workflows folder as same-basename JSON and JPG template pairs."

[[ignore]]
check = "structure/trivial-functions"
names = ["get_node_list", "comfy_entrypoint", "define_schema"]
paths = ["__init__.py", "src/nodes/**"]
reason = "ComfyUI requires these entry points and schema methods."
