[default]
locale = "en"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-words]

[files]
extend-exclude = [
  # Files that Git ignores
  "**/.DS_Store",
  "**/.venv/**",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/.env",
  "**/.env.*",
  "**/.artifacts/**",
  "**/.mise.local.toml",
  # Files that gspot generates
  ".gspot/**",
  "ruff.toml",
  "pyrightconfig.json",
  ".markdownlint.jsonc",
  ".editorconfig",
  "prettier.config.mjs",
  ".prettierignore",
  # Generator outputs
  "example_workflows/assets/hosts/*.png",
  "**/*.pbxproj",
  "**/*.xcstrings",
  "**/*.svg",
  "**/*.min.js",
  "**/*.min.css",
  # Paths that configurations leave out, such as installed dependencies and local secrets
  "**/venv/**",
  "**/.dev.vars",
  "**/.dev.vars.*",
  # Lockfiles
  "**/*.lock",
  "**/bun.lockb",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/npm-shrinkwrap.json",
  "**/go.sum",
  "**/Package.resolved",
  # Local environment files
  "**/.env*",
]
